name: iOS release

on:
  workflow_call:

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    name: Build IPA and upload to TestFlight (internal)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/native

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Match repository access
        env:
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MATCH_GIT_PRIVATE_KEY" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Configure App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}
        run: |
          node -e 'require("fs").writeFileSync(`${process.env.RUNNER_TEMP}/AuthKey.p8`, Buffer.from(process.env.APP_STORE_CONNECT_API_KEY_P8_B64, "base64"))'

      - name: Build IPA and upload to TestFlight
        working-directory: apps/native
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          EXPO_PUBLIC_API_URL: https://rozliczkorki.pl
          EXPO_PUBLIC_GOOGLE_IOS_URL_SCHEME: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_URL_SCHEME }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/match_key -o StrictHostKeyChecking=accept-new
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bash scripts/build-ios-release.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RozliczKorki-ios-${{ github.run_number }}
          path: apps/native/artifacts/ios/RozliczKorki.ipa
