name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      web:
        description: Deploy web
        type: boolean
        default: false
      web_force:
        description: Rebuild web without cache
        type: boolean
        default: false
      android:
        description: Release Android
        type: boolean
        default: false
      ios:
        description: Release iOS to TestFlight internal testing
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint:typecheck

      - name: Lint
        run: pnpm lint:check

      - name: Check formatting
        run: pnpm format:check

  migrations:
    name: Migrations and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rozliczkorki
          POSTGRES_PASSWORD: rozliczkorki
          POSTGRES_DB: rozliczkorki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rozliczkorki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rozliczkorki:rozliczkorki@localhost:5432/rozliczkorki
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to an empty database
        run: pnpm --filter @repo/db db:migrate:deploy

      - name: Apply migrations again to prove they are idempotent
        run: pnpm --filter @repo/db db:migrate:deploy

      - name: Check the schema matches the migrations
        run: |
          pnpm --filter @repo/db exec drizzle-kit generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::schema.ts drifted from the migrations. Run 'pnpm --filter @repo/db db:generate' and commit the result."
            git status --porcelain packages/db/drizzle
            exit 1
          fi

      - name: Build web
        run: pnpm --filter web build

  changes:
    name: Detect changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - apps/web/**
              - packages/**
              - pnpm-lock.yaml
              - .github/workflows/web-deploy.yml
            android:
              - apps/native/**
              - packages/**
              - pnpm-lock.yaml
              - .github/workflows/android-release.yml
            ios:
              - apps/native/**
              - packages/**
              - pnpm-lock.yaml
              - .github/workflows/ios-release.yml

  web:
    name: Web
    needs: [check, migrations, changes]
    if: >-
      always() && needs.check.result == 'success' && needs.migrations.result == 'success' &&
      (needs.changes.outputs.web == 'true' || (github.event_name == 'workflow_dispatch' && inputs.web))
    uses: ./.github/workflows/web-deploy.yml
    with:
      force: ${{ inputs.web_force || false }}
    secrets: inherit

  android:
    name: Android
    needs: [check, changes]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.changes.outputs.android == 'true' || (github.event_name == 'workflow_dispatch' && inputs.android))
    uses: ./.github/workflows/android-release.yml
    secrets: inherit

  ios:
    name: iOS
    needs: [check, changes]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.changes.outputs.ios == 'true' || (github.event_name == 'workflow_dispatch' && inputs.ios))
    uses: ./.github/workflows/ios-release.yml
    secrets: inherit
